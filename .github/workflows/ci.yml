name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build packages before typecheck — exports point to ./dist/
      - name: Build packages
        run: pnpm --filter './packages/**' build

      - name: Verify
        run: pnpm verify

      - name: Security audit
        run: pnpm audit --audit-level high
