# SOPscape Nginx Configuration
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sopscape
# Enable: sudo ln -s /etc/nginx/sites-available/sopscape /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d your-domain.com

upstream sopscape_backend {
    server 127.0.0.1:3000;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=sopscape_api:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.okx.ai;" always;

    # Logging
    access_log /var/log/nginx/sopscape_access.log;
    error_log /var/log/nginx/sopscape_error.log;

    # Health checks (no rate limit)
    location /health/ {
        proxy_pass http://sopscape_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2MCP API (with rate limit)
    location /a2mcp/ {
        limit_req zone=sopscape_api burst=20 nodelay;

        proxy_pass http://sopscape_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (58s deadline + buffer)
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Product API (with rate limit)
    location /api/ {
        limit_req zone=sopscape_api burst=30 nodelay;

        proxy_pass http://sopscape_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # MCP Protocol
    location /mcp {
        limit_req zone=sopscape_api burst=10 nodelay;

        proxy_pass http://sopscape_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend (Vite dev / static)
    location / {
        # For production: serve static files
        root /var/www/sopscape-web;
        try_files $uri $uri/ /index.html;

        # For development: proxy to Vite
        # proxy_pass http://127.0.0.1:5173;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
    }

    # Share routes (no auth required)
    location /r/ {
        proxy_pass http://sopscape_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
